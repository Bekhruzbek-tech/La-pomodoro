<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="style.css">
    <audio id="myaudio" src="Harp-Ambient-Music-Vindsvept-The-Fae.m4a"> </audio>
</head>
<body>
    <h1>Pomodoro Timer</h1>
    <div class="modal" id="modal">
        <div class="modal-inner">
            <h2>Wish you the best study sessions</h2>
            <button id="close-modal">Close</button>
        </div>
    </div>
    <div id="timer-message">Please select a timer before starting</div>
    <div class="container">
    <div class="timer">
        <div class="button-container">
            <button class = "button" id='pomodoro-session'> pomodoro</button>
            <button class = "button" id='short-break'> short break</button>
            <button class = "button" id='long-break'> long break</button>
        </div> 
            <main>
                <div class="pomodoro">
                    <div id="pomodoro-timer" class="timer-display" data-duration="25.00">
                        <h1 class="time">25:00</h1>
                    </div>
                    <div id="short-timer" class="timer-display" data-duration="5.00">
                        <h1 class="time">5:00</h1>
                    </div>
                    <div id="long-timer" class="timer-display" data-duration="10.00">
                        <h1 class="time">10:00</h1>
                    </div>
                </div> 
            </main>
            <div class="buttons">
                <button id="start" class="control-button">Start</button>
                <button id="stop" class="control-button">Stop</button>
        </div>
    </div>
   

    <div id="popup-overlay">
        <div id="popup-box">
            <h2>Quick Question</h2>
            <p>Why do you use the Pomodoro technique?</p>

            <div class="options">
                <label><input type="radio" name="reason" value="Studying"> For studying</label><br>
                <label><input type="radio" name="reason" value="University"> For university</label><br>
                <label><input type="radio" name="reason" value="Work"> For work</label><br>
                <label><input type="radio" name="reason" value="Focus"> To improve focus</label><br>
            </div>

            <button id="popup-submit">Submit</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
